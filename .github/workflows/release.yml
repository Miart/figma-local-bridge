# Build the self-contained macOS release on a version tag and attach it to the
# GitHub Release for that tag.
#
# Manual releases (see the README) do the same two commands by hand:
# `npm run build` then `npm run build:release`, then `gh release create`. This
# workflow keeps the artifact and the tag in step, so a pushed `v*` tag either
# produces a downloadable zip or a red run that says why.
#
# macOS is required: `build-release.mjs` packs the zip with `ditto`, and the
# release is a macOS app bundle, not a cross-platform tarball.
name: release

on:
  push:
    tags:
      - "v*"

# A release needs to create the release and upload its assets. Everything else
# in this workflow only reads.
permissions:
  contents: write

# One run per tag; a re-push of the same tag replaces the assets rather than
# racing two jobs into `gh release upload`.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-zip:
    name: build and attach the macOS zip
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same gate the pre-commit hook runs, over every tracked file.
      - name: Privacy gate
        run: npm run check:privacy

      - name: Build plugin and server
        run: npm run build

      - name: Build the self-contained zip
        run: npm run build:release

      # The tag may already carry a hand-written release; if so, only attach to
      # it. Otherwise create one from the commits since the last tag.
      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --verify-tag --generate-notes
          fi
          gh release upload "$tag" \
            release/figma-local-bridge-*-macos.zip \
            release/figma-local-bridge-*-macos.zip.sha256 \
            --clobber
